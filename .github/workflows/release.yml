name: Release

# Triggered by tag pushes from `just release` (gh release create pushes the
# tag, which fires this workflow). The workflow attaches signed assets to the
# already-created release via `gh release upload`, so `just release` itself
# requires no changes. There is a brief ~60-90s window where the release exists
# with no assets while signing runs - acceptable for an IaC repo.
on:
  push:
    tags:
      - 'v*'

# Empty global permissions - each job declares what it needs.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    # Signing and SBOM are external round-trips; don't let a hung step
    # burn the 6h default.
    timeout-minutes: 15
    permissions:
      contents: write    # gh release upload
      id-token: write    # cosign keyless OIDC
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The bundle is the full tagged tree via git archive; .gitattributes
      # export-ignore already trims .gitignore/.gitattributes from it.
      # No hand-maintained include list to drift as the repo evolves.
      - name: Build asset bundle
        id: bundle
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          BUNDLE="fini-infra-${TAG}.tar.gz"
          git archive --format=tar.gz --output="${BUNDLE}" "${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "bundle=${BUNDLE}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ steps.bundle.outputs.bundle }}
          format: json
          output-file: ${{ steps.bundle.outputs.bundle }}.sbom.json

      # Generated after the SBOM so checksums.txt covers both the bundle and
      # the SBOM. Integrity chain: bundle (cosign-signed) -> checksums.txt
      # (SLSA provenance subject) -> SBOM hash pinned inside checksums.txt.
      - name: Generate checksums
        env:
          BUNDLE: ${{ steps.bundle.outputs.bundle }}
        run: |
          set -euo pipefail
          sha256sum "${BUNDLE}" "${BUNDLE}.sbom.json" > checksums.txt
          cat checksums.txt

      - name: Generate subject hashes for SLSA provenance
        id: hash
        env:
          BUNDLE: ${{ steps.bundle.outputs.bundle }}
        run: |
          set -euo pipefail
          # SLSA generator expects base64-encoded sha256sum lines.
          hashes=$(sha256sum "${BUNDLE}" checksums.txt | base64 -w0)
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign asset bundle with cosign (keyless)
        env:
          BUNDLE: ${{ steps.bundle.outputs.bundle }}
        run: |
          set -euo pipefail
          # Keyless signing via GitHub OIDC - no long-lived secrets to rotate.
          # The --bundle file embeds the signature, certificate, and Rekor
          # entry; verify downstream with an EXACT identity match (no regex,
          # so no metacharacter-escaping concerns in tag names):
          #   cosign verify-blob \
          #     --bundle fini-infra-${TAG}.tar.gz.bundle \
          #     --certificate-identity \
          #       "https://github.com/fini-net/fini-infra/.github/workflows/release.yml@refs/tags/${TAG}" \
          #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          #     fini-infra-${TAG}.tar.gz
          cosign sign-blob --yes "${BUNDLE}" \
            --bundle "${BUNDLE}.bundle"

      - name: Upload signed assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bundle.outputs.tag }}
          BUNDLE: ${{ steps.bundle.outputs.bundle }}
        run: |
          set -euo pipefail
          # `just release` (gh release create) normally fires this workflow by
          # pushing the tag, so the release already exists. If someone pushed
          # a v* tag manually without creating the release first, create it
          # here rather than failing the upload.
          gh release view "${TAG}" >/dev/null 2>&1 || \
            gh release create "${TAG}" --generate-notes --verify-tag
          gh release upload "${TAG}" \
            "${BUNDLE}" \
            checksums.txt \
            "${BUNDLE}.bundle" \
            "${BUNDLE}.sbom.json" \
            --clobber

  provenance:
    needs: release
    # Note: timeout-minutes isn't allowed on a reusable-workflow call job;
    # the generator's internal jobs set their own timeouts.
    permissions:
      actions: read
      id-token: write
      contents: write
    # SLSA generator requires a tag ref (refs/tags/vX.Y.Z) for its internal
    # builder checkout; pinning to a git SHA causes "Invalid ref" errors and
    # provenance generation failure.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true
