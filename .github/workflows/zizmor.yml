name: GHA security analysis with zizmor

on:
  push:
    branches: ["main"]
    paths:
      - ".github/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/**"
  workflow_dispatch:

# global permissions
permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      # actions/checkout has been on v6 since November 2025
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zizmor-action handles SARIF upload to GitHub Advanced Security internally
      # (no separate upload step needed when advanced-security is true, which is the default)
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
