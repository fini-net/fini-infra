name: GHA security analysis with zizmor

on:
  push:
    branches: ["main"]
    paths:
      - ".github/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/**"
  workflow_dispatch:

# global permissions
permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      # actions/checkout has been on v6 since November 2025
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zizmor-action handles SARIF upload to GitHub Advanced Security internally
      # (no separate upload step needed when advanced-security is true, which is the default)
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
